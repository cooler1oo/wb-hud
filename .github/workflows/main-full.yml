# ③ 合进默认分支之后：把全部检查跑一遍（没有 pytest 慢测试，这里是语法 + 31 项计费回归）。
# 红了不回滚，直接再提交一个修复（往前修）。
# 发布只从这里全绿的提交里挑。
name: 主分支全量检查

on:
  push:
    branches: [main] # 默认分支不叫 main 的，换成实际的名字

jobs:
  full:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install ruff

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: 规则检查
        run: ruff check .

      - name: Python 语法（全部脚本）
        run: python -m py_compile tools/*.py ui/*.py

      - name: 前端脚本语法
        run: |
          for f in ui/*.js; do node --check "$f"; done

      # 主进程的日志扫描：子代理归并、增量不重复、截断后重建。
      # 这段逻辑读的是客户端真实文件布局，只能用构造目录的方式测。
      - name: 主进程扫描逻辑（子代理汇总）
        run: node scripts/test_hist_scan.js

      - name: 计费规则已同步
        run: python tools/sync_billing.py --check

      # 31 项回归：分类 / 计价公式 / 会话单位跟随 / 脏时间戳 / 三处真源一致 /
      # JS 与 Python 结论一致。需要读本机会话日志的那几项在没有日志时自动跳过，
      # 所以在 CI 上也能跑，不会假绿也不会假红。
      - name: 计费回归测试
        run: python tools/test_billing.py
