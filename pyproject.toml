# 本仓库不是一个可安装的 Python 包：这里的脚本是给 WorkBuddy 客户端打补丁用的，
# 由 tools/install.py 原地运行，不需要 pip install。所以没有 [project] / [build-system]。
# 这里只放工具配置，CI 里用 `pip install ruff` 就够。

[tool.ruff]
line-length = 100

# 钉住经典规则集合（语法错、未定义名、未使用导入）。
# 不选 E5 是有意的：本仓库有大量中文字符串与拼接，行长不是重点，别为了格式化制造无意义 diff。
[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]

[tool.ruff.lint.per-file-ignores]
# E402：这些脚本必须先把 ui/ 插进 sys.path 才能 import patch，导入顺序无法上移。
# E722：安装/补丁脚本里有刻意保留的宽 except（客户端环境千奇百怪，抛栈比静默更糟）。
"tools/install.py" = ["E402", "E722"]
"tools/uninstall.py" = ["E402"]
"tools/selftest.py" = ["E402"]
"ui/patch.py" = ["E722"]
